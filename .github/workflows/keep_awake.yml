name: Wake Up CleanCycle App

on:
  schedule:
    # Berjalan setiap 4 jam
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memungkinkan tombol manual di tab Actions

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # PERBAIKAN 1: Mengubah 'python-node-version' menjadi 'python-version'
        python-version: '3.10' 

    - name: Install Dependencies
      run: |
        pip install playwright
        playwright install chromium

    - name: Execute Wake Up Script
      env:
        STREAMLIT_APP_URL: "https://streamlit.app"
        # PERBAIKAN 2: Memaksa penggunaan Node24 untuk menghilangkan warning deprecation
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" 
      run: python wake_app.py
